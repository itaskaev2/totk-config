[package]
name = "totk-config"
version = "0.5.0"
edition = "2021"
description = "Settings configurator for the TotK PC recomp: edits totk.ini and settings profiles before the game starts"
license = "MIT"
repository = "https://github.com/itaskaev2/totk-config"
publish = false

[[bin]]
name = "totk-config"
path = "src/main.rs"

[dependencies]
# MIT OR Apache-2.0. glow (OpenGL) only: no wgpu, no accesskit; fonts come from fonts/ and the system.
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
rfd = "0.15.4"            # MIT: the folder picker
serde = { version = "1", features = ["derive"] }   # MIT OR Apache-2.0
serde_json = "1"          # MIT OR Apache-2.0
sha2 = "0.10"            # MIT OR Apache-2.0: the SHA-256 of a downloaded release

# Updates from the GitHub releases (src/update.rs). Windows: HTTPS through Schannel and the Windows certificate store.
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }   # MIT OR Apache-2.0

# Elsewhere: rustls with the Mozilla root list built in, so the Linux binary needs no OpenSSL of a given version.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }   # MIT OR Apache-2.0

# Linux: X11 and Wayland windows. winit's defaults load libX11, libwayland and libxkbcommon at run time (dlopen), so the
# build needs none of their -dev packages.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "x11", "wayland"] }
winit = "0.30"           # Apache-2.0: only for its default features (wayland-dlopen, wayland-csd-adwaita)

[build-dependencies]
embed-resource = "3"      # MIT: the icon resource (build.rs)

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
